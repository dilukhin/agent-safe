name: Проверка PR 5

on:
  push:
    branches:
      - agent/structured-expected-state-verification

permissions:
  contents: read

jobs:
  checks:
    name: Обязательные проверки
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Показать версию Python
        run: python --version

      - name: Запустить модульные тесты
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Проверить справку CLI
        env:
          PYTHONPATH: src
        run: python -m agent_safe --help

      - name: Проверить dry-run OpenCode bootstrap
        env:
          PYTHONPATH: src
        run: python -m agent_safe opencode-bootstrap --scope project --dry-run
