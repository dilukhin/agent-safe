name: Применение совместимого исправления

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить ветку PR
        uses: actions/checkout@v6
        with:
          ref: agent/add-ci-workflow
          fetch-depth: 0

      - name: Настроить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Применить точечные изменения
        run: |
          python .github/apply_compat_fix.py
          git checkout HEAD -- .github/workflows/ci.yml

      - name: Проверить изменения
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile src/agent_safe/__init__.py src/agent_safe/opencode_bootstrap.py tests/test_cli.py tests/test_opencode_bootstrap.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Создать commit
        run: |
          git config user.name "agent-safe CI"
          git config user.email "agent-safe-ci@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Исправлена совместимость с Python 3.14 и Windows"
          git push origin HEAD:agent/add-ci-workflow
