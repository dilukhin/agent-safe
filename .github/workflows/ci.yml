name: Применение совместимого исправления

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить ветку PR
        uses: actions/checkout@v6
        with:
          ref: agent/add-ci-workflow

      - name: Проверить и применить изменения
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = {
              "src/agent_safe/__init__.py": "c71212a669c27801b4b1c7a931772c9ca507da77",
              "src/agent_safe/opencode_bootstrap.py": "b63c8485aacac1b6f8a7d87bde1b06eb6603fb33",
              "tests/test_cli.py": "02498dc069a4cc7f86278a78f30deb4a09d1bd33",
              "tests/test_opencode_bootstrap.py": "26eee243c198f18682456cd4b7f03754e85997ff",
          }

          def blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          for name, sha in expected.items():
              actual = blob_sha(Path(name))
              if actual != sha:
                  raise SystemExit(f"unexpected source blob {name}: {actual} != {sha}")

          Path("src/agent_safe/__init__.py").write_text(
              '''"""agent-safe: cross-platform safety runtime for CLI agents."""

import os
import sys


def _configure_windows_stdout_utf8() -> None:
    # Windows может выбрать однобайтовую code page, неспособную вывести русский JSON.
    if os.name != "nt":
        return
    reconfigure = getattr(sys.stdout, "reconfigure", None)
    if callable(reconfigure):
        reconfigure(encoding="utf-8")


_configure_windows_stdout_utf8()

__version__ = "0.4.0"
''',
              encoding="utf-8",
          )

          path = Path("src/agent_safe/opencode_bootstrap.py")
          text = path.read_text(encoding="utf-8")
          old = '''from importlib import resources
from importlib.abc import Traversable
'''
          new = '''from importlib import resources
try:
    from importlib.resources.abc import Traversable
except ImportError:  # Python 3.10: Traversable ещё находится в importlib.abc.
    from importlib.abc import Traversable
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected Traversable import block")
          path.write_text(text.replace(old, new), encoding="utf-8")

          path = Path("tests/test_cli.py")
          text = path.read_text(encoding="utf-8")
          old = '''            text=True,
            capture_output=True,
'''
          new = '''            encoding="utf-8",
            capture_output=True,
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected test_cli subprocess block")
          text = text.replace(old, new, 1)
          marker = '\n\nif __name__ == "__main__":\n'
          test = '''
    @unittest.skipUnless(os.name == "nt", "проверка относится только к Windows")
    def test_bootstrap_json_uses_utf8_on_windows(self):
        with tempfile.TemporaryDirectory() as td:
            env = os.environ.copy()
            env["PYTHONIOENCODING"] = "cp1252"
            proc = subprocess.run(
                [sys.executable, "-m", "agent_safe", "--root", td,
                 "opencode-bootstrap", "--scope", "project", "--dry-run"],
                env=env,
                encoding="utf-8",
                capture_output=True,
            )
            self.assertEqual(proc.returncode, 0, proc.stderr + proc.stdout)
            payload = json.loads(proc.stdout)
            self.assertEqual(payload["mode"], "dry-run")
            self.assertIn("Порядок действий", proc.stdout)
'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected test_cli footer")
          path.write_text(text.replace(marker, test + marker), encoding="utf-8")

          path = Path("tests/test_opencode_bootstrap.py")
          text = path.read_text(encoding="utf-8")
          import_marker = "from pathlib import Path\n"
          if text.count(import_marker) != 1:
              raise SystemExit("unexpected bootstrap test imports")
          text = text.replace(
              import_marker,
              import_marker + "\nfrom agent_safe.opencode_bootstrap import _template_root\n",
              1,
          )
          old = '''            text=True,
            capture_output=True,
'''
          new = '''            encoding="utf-8",
            capture_output=True,
'''
          if text.count(old) != 1:
              raise SystemExit("unexpected bootstrap test subprocess block")
          text = text.replace(old, new, 1)
          marker = "    def test_opencode_bootstrap_dry_run_does_not_write(self) -> None:\n"
          test = '''    def test_packaged_template_root_is_available(self) -> None:
        template_root = _template_root()
        self.assertTrue(template_root.joinpath("opencode.json").is_file())
        self.assertTrue(template_root.joinpath("skills").is_dir())

'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected bootstrap test method marker")
          path.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")
          PY

          git checkout b110a985a449e0b43edd9a34fa03785b301a7c6d -- .github/workflows/ci.yml
          python -m py_compile \
            src/agent_safe/__init__.py \
            src/agent_safe/opencode_bootstrap.py \
            tests/test_cli.py \
            tests/test_opencode_bootstrap.py
          PYTHONPATH=src python -m unittest discover -s tests -v
          git diff --check

      - name: Создать commit
        shell: bash
        run: |
          git config user.name "agent-safe CI"
          git config user.email "agent-safe-ci@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            src/agent_safe/__init__.py \
            src/agent_safe/opencode_bootstrap.py \
            tests/test_cli.py \
            tests/test_opencode_bootstrap.py
          git diff --cached --stat
          git commit -m "Исправлена совместимость с Python 3.14 и Windows"
          git push origin HEAD:agent/add-ci-workflow
