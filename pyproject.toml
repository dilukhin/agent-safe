[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safe"
version = "0.3.0"
description = "Cross-platform safety runtime for CLI agents"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dmitry Ilyukhin" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent"
]
dependencies = []

[tool.setuptools.package-data]
agent_safe = ["templates/opencode/opencode.json", "templates/opencode/skills/*/SKILL.md"]

[project.scripts]
safe = "agent_safe.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
